<div class="console" [class.collapsed]="!visible()">
  <div class="bar">
    <span class="title monofont">CONSOLE</span>
    <span class="counter">{{ count() }} événements</span>
    <button type="button" class="btn-ghost small toggle" (click)="toggle()">
      {{ visible() ? '▼ Masquer' : '▲ Afficher' }}
    </button>
  </div>
  @if (visible()) {
    <div class="terminal" #terminal>
      @for (line of lines(); track $index) {
        <div class="line monofont" [attr.data-channel]="line.channel">
          {{ formatLine(line) }}
        </div>
      }
    </div>
  }
</div>
